<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/img/header/pokeball-img.png" type="image/x-icon" />
    <title>Pokedex</title>

    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="styles.css">

</head>
<body onload="init()">
    <header>
        <figure class="logo-header">
            <img class="logo-img" src="./assets/img/header/pokeball-img.png" alt="logo-img">
            <figcaption class="logo-text">Pokedex</figcaption>
        </figure>
        <input>
    
        </input>
    </header>
    <main>
        <article id="contentRow" class="content-row"></article> 
            <dialog id="myModal" class="modal" tabindex="0" aria-labelledby="caption" onclick="closeModal()" onkeydown="modalKeys(event)"> 
                <header id="headline" class="header-modal" onclick="event.stopPropagation()"> 
                    <h2 id="caption" class="title-modal"></h2>
                    <button id="close-button-icon" class="close-icon" aria-label="closing dialog" onclick="closeModal()"></button>
                </header>
                <img id="img" class="modal-content" onclick="event.stopPropagation()">
                <section id="buttons" class="buttons-modal" onclick="event.stopPropagation()">
                    <button id="prev" class="left" aria-label="go to previous gallery picture" onclick="renderFiltered(-1)"></button>
                    <div id="index" class="index-line">
                        <span id="photo-nr"></span><span id="array-length"></span>
                    </div>  
                    <button id="next" class="right" aria-label="go to next gallery picture" onclick="renderFiltered(1)"></button>
                    <div id="placeholder-fav-icon" aria-label="activate or deactivate favorite picture"></div>
                </section>
            </dialog>
    </main>
    <footer>

    </footer>
    <script src="./scripts/templates.js"></script>
    <script src="./script.js"></script>
</body>
</html>
